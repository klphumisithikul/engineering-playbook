# Generic, self-contained GitLab CI/CD pipeline matching the stage order and
# principles documented in README.md's "GitLab CI/CD Standards" section:
#   lint -> unit -> build -> integration -> security -> staging -> production
#
# This file has no external `include:` so it works standalone in a new repo.
# Once you have shared templates in a central `ci-templates` project, prefer
# `include`/`extends` to keep this thin (see README.md for that pattern).

workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH =~ /^(feature|bugfix|hotfix)\//
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - if: $CI_COMMIT_TAG

stages:
  - lint
  - test
  - build
  - integration
  - security
  - deploy

default:
  interruptible: true

lint:
  stage: lint
  image: alpine:3.20
  script:
    - echo "TODO: run this project's linter/formatter check"

unit_test:
  stage: test
  image: alpine:3.20
  script:
    - echo "TODO: run this project's unit test suite"
  artifacts:
    reports:
      junit: report.xml
    expire_in: 7 days
  rules:
    - when: on_success

build_image:
  stage: build
  image: docker:27
  services:
    - docker:27-dind
  needs: ["unit_test"]
  script:
    - docker build -t "$CI_REGISTRY_IMAGE:$CI_COMMIT_SHORT_SHA" .
  artifacts:
    paths: ["dist/"]
    expire_in: 7 days
  rules:
    - when: on_success

integration_test:
  stage: integration
  image: alpine:3.20
  needs: ["build_image"]
  script:
    - echo "TODO: run integration/e2e tests against the built artifact"

security_scan:
  stage: security
  image: alpine:3.20
  needs: ["build_image"]
  allow_failure: false
  script:
    - echo "TODO: run SAST/DAST/dependency scanning (block on critical findings)"

deploy_staging:
  stage: deploy
  image: alpine:3.20
  environment:
    name: staging
  needs: ["integration_test", "security_scan"]
  script:
    - echo "TODO: deploy to staging (e.g., trigger Argo CD sync, see README.md)"
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

deploy_production:
  stage: deploy
  image: alpine:3.20
  environment:
    name: production
  needs: ["deploy_staging"]
  script:
    - echo "TODO: deploy to production"
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      when: manual
