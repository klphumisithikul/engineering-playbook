# Multi-OS build validation matrix, per the SDLC "Testing" phase cross-platform
# requirement. Runs the same build on macOS, Windows, and Linux to catch
# platform-specific issues (path separators, case-sensitivity, line endings)
# early. Stack-agnostic placeholder — fill in the real build command.
name: Build (Multi-OS)

on:
  pull_request:
  push:
    branches: [main, develop]

permissions:
  contents: read

jobs:
  build:
    name: Build on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
